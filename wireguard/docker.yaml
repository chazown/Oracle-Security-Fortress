version: "3.8"

services:
  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:latest
    container_name: wg-easy
    restart: always
    network_mode: "host"
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      - WG_HOST=<YOUR_SERVER_PUBLIC_IP>
      - WG_DEFAULT_DNS=10.8.0.1
      - PASSWORD=<YOUR_SECURE_PASSWORD>
    volumes:
      - ./data:/etc/wireguard
